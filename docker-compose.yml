name: bpom-jember-superapp

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bpom_jember}
      MYSQL_USER: ${DB_USERNAME:-bpom}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: "${APP_KEY:?missing APP_KEY in .env, generate one with php artisan key:generate --show}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bpom_jember}
      DB_USERNAME: ${DB_USERNAME:-bpom}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      CORS_ALLOWED_ORIGINS: "http://${SERVER_IP:-147.93.159.225}:3000,http://localhost:3000"
    # `php artisan serve` tidak meneruskan env var Docker ke konteks HTTP, sehingga
    # env('DB_CONNECTION') kosong di request → Laravel fallback ke sqlite kosong.
    # `config:cache` me-resolve nilai env di CLI lalu menuliskannya ke file yang
    # dibaca semua konteks (termasuk HTTP), agar API selalu memakai MySQL yang benar.
    command: sh -c "php artisan config:clear; until php artisan migrate --force; do echo 'Menunggu MySQL siap...'; sleep 3; done; php artisan db:seed --force; php artisan storage:link || true; php artisan config:cache; php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - api_storage:/var/www/html/storage/app/public

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* di-inline saat BUILD (bukan runtime). Harus alamat yang
        # bisa dijangkau BROWSER pengguna — yaitu IP publik VPS, bukan localhost.
        NEXT_PUBLIC_API_URL: "http://${SERVER_IP:-147.93.159.225}:8000/api"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  api_storage:
