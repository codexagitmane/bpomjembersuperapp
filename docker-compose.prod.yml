name: lentera-prod

# Stack production LENTERA BPOM Jember.
# HTTPS otomatis via Caddy + Let's Encrypt (butuh domain, mis. nip.io yang
# menunjuk ke IP VPS). Semua service internal; hanya Caddy yang expose 80/443.
#
# Jalankan:  docker compose -f docker-compose.prod.yml up -d --build
# Wajib ada file .env berisi APP_KEY, DB_*, dan DOMAIN.

# Env aplikasi dipakai bersama oleh api, worker, dan scheduler agar ketiganya
# selalu membaca konfigurasi yang persis sama (beda nilai = antrian nyasar).
x-env-app: &env-app
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN:-147.93.159.225.nip.io}
  APP_KEY: "${APP_KEY:?APP_KEY wajib diisi di .env}"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-bpom_jember}
  DB_USERNAME: ${DB_USERNAME:-bpom}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  # Redis dipakai untuk cache, session, dan antrian. Klien `predis` (PHP murni)
  # sengaja dipilih agar image tidak perlu kompilasi ekstensi phpredis.
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  CORS_ALLOWED_ORIGINS: https://${DOMAIN:-147.93.159.225.nip.io}

x-depends-data: &depends-data
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bpom_jember}
      MYSQL_USER: ${DB_USERNAME:-bpom}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: always
    # appendonly: session pengguna & antrian surel tetap hidup setelah restart
    # container. Tanpa ini semua pengguna ter-logout tiap kali stack di-deploy.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    depends_on: *depends-data
    environment:
      <<: *env-app
      # `php artisan serve` (server bawaan PHP) single-thread → request paralel
      # (mis. polling /api/notifikasi bertabrakan dengan /api/pegawai) bisa saling
      # menimpa & memberi respons nyasar/500. Fork banyak worker agar aman.
      PHP_CLI_SERVER_WORKERS: "10"
    # PENTING: `php artisan serve` TIDAK meneruskan env var Docker ke request HTTP,
    # sehingga env('DB_CONNECTION') kosong di konteks HTTP → Laravel fallback ke
    # sqlite (DB kosong) padahal CLI pakai mysql. `config:cache` me-resolve semua
    # nilai env di CLI (mysql benar) lalu menuliskannya ke file yang dibaca SEMUA
    # konteks (termasuk HTTP), sehingga API selalu memakai MySQL yang benar.
    # Volume MySQL baru butuh waktu init (start → setup → restart), sehingga
    # `migrate` bisa kena "Connection refused" walau healthcheck sempat lolos.
    # `until … done` mengulang migrate sampai MySQL benar-benar menerima koneksi,
    # baru lanjut seed + config:cache + serve.
    command: sh -c "php artisan config:clear; until php artisan migrate --force; do echo 'Menunggu MySQL siap...'; sleep 3; done; php artisan db:seed --force; php artisan storage:link || true; php artisan config:cache; php artisan serve --host=0.0.0.0 --port=8000"
    stop_grace_period: 3s
    volumes:
      - api_storage:/var/www/html/storage/app/public

  # Pekerja antrian: mengirim surel (aktivasi akun, konfirmasi & pengingat
  # booking) di latar belakang. Tanpa service ini antrian Redis tidak pernah
  # diproses dan surel tidak terkirim.
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      <<: *depends-data
      api:
        condition: service_started
    environment: *env-app
    # Migrasi dikerjakan service `api`; worker cukup menunggu tabel siap.
    command: sh -c "php artisan config:clear; until php artisan migrate:status >/dev/null 2>&1; do echo 'Menunggu database siap...'; sleep 3; done; php artisan config:cache; php artisan queue:work redis --tries=3 --backoff=10 --max-time=3600 --sleep=3"
    stop_grace_period: 30s
    volumes:
      - api_storage:/var/www/html/storage/app/public

  # Penjadwal: menjalankan tugas terjadwal Laravel (mis. pengingat H-1 booking
  # konsultasi pukul 07:00 WIB). Menggantikan entri cron di host.
  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      <<: *depends-data
      api:
        condition: service_started
    environment: *env-app
    command: sh -c "php artisan config:clear; until php artisan migrate:status >/dev/null 2>&1; do echo 'Menunggu database siap...'; sleep 3; done; php artisan config:cache; php artisan schedule:work"
    stop_grace_period: 10s
    volumes:
      - api_storage:/var/www/html/storage/app/public

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-147.93.159.225.nip.io}/api
    restart: always
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-147.93.159.225.nip.io}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  redis_data:
  api_storage:
  caddy_data:
  caddy_config:
